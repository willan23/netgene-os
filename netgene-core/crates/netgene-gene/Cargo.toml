[package]
name = "netgene-gene"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "NetGene Gene Layer — Cryptographic identity and hierarchical key management"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ring = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "android")'.dependencies]
# Secrets encrypted with a key held by the Android Keystore (hardware-backed where available).
android-native-keyring-store = "1.0"
keyring-core = "1"

[dev-dependencies]
tempfile = "3"

