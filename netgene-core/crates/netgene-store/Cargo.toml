[package]
name = "netgene-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NetGene Store — redb-based persistence layer with CRDT state synchronization"

[features]
default = ["sled-migration"]
# One-time import of databases written by NetGene <= 0.6 (sled backend).
sled-migration = ["dep:sled"]

[dependencies]
redb = "4.4"
sled = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
