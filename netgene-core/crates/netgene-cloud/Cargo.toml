[package]
name = "netgene-cloud"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
netgene-kernel = { path = "../netgene-kernel" }
