# cargo deny check — licenses, advisories, banned and duplicate crates, sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is a compile-time proc macro pulled by libp2p 0.57 (netlink-packet-core,
    # Linux interface watching). Unmaintained, no known vulnerability, no runtime code.
    # Drop this once libp2p moves off it.
    { id = "RUSTSEC-2024-0436", reason = "transitive proc-macro via libp2p; no vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
