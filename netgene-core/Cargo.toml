[workspace]
members = [
    "crates/netgene-gene",
    "crates/netgene-kernel",
    "crates/netgene-store",
    "crates/netgene-llm",
    "crates/netgene-p2p",
    "crates/netgene-wasm",
    "crates/netgene-vault",
    "crates/netgene-safeguard",
    "crates/netgene-policy",
    "crates/netgene-presence",
    "crates/netgene-enterprise",
    "crates/netgene-ebpf",
    "crates/netgene-cli",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
authors = ["NetGene OS contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/willan23/netgene-os"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
ring = "0.17"
sha3 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# CLI
clap = { version = "4", features = ["derive", "color", "env"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Randomness
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for Ollama)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Persistence (sled embedded DB)
sled = "0.34"

# P2P networking (libp2p)
libp2p = { version = "0.57", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "gossipsub",
    "kad",
    "mdns",
    "ping",
    "macros",
    "request-response",
    "json",
] }

# Internal crates
netgene-gene      = { path = "crates/netgene-gene" }
netgene-kernel    = { path = "crates/netgene-kernel" }
netgene-store     = { path = "crates/netgene-store" }
netgene-llm       = { path = "crates/netgene-llm" }
netgene-p2p       = { path = "crates/netgene-p2p" }
netgene-wasm      = { path = "crates/netgene-wasm" }
netgene-vault     = { path = "crates/netgene-vault" }
netgene-safeguard = { path = "crates/netgene-safeguard" }
netgene-policy    = { path = "crates/netgene-policy" }
netgene-presence  = { path = "crates/netgene-presence" }
netgene-enterprise = { path = "crates/netgene-enterprise" }
netgene-ebpf      = { path = "crates/netgene-ebpf" }
